            <h2 style="color: #1e5631; margin-top: 0; font-size: 22px;">แบบแจ้งข้อมูลขยะอันตราย<br><span style="font-size: 16px; color: #555;">เพื่อรวบรวมส่งบริษัทกำจัดขยะ</span></h2>
        </div>

        <div id="googleSignIn"></div>
<form id="hazardousForm">
            <!-- ส่วนข้อมูลหน่วยงาน -->
            <div class="form-section">
                <div class="form-group">
                    <label for="date">วันที่แจ้งข้อมูล:</label>
                    <input type="date" id="date" required>
                </div>
                
                <div class="form-group autocomplete-wrapper">
                    <label for="buildingName">ส่วนงาน / ชื่ออาคาร:</label>
                    <input type="text" id="buildingName" placeholder="พิมพ์เพื่อค้นหาส่วนงาน/คณะ/กอง หรือชื่อตึก" autocomplete="off" required>
                    <ul id="departmentDropdown" class="autocomplete-items hidden"></ul>
                </div>

                <div class="form-group">
                    <label for="contactName">ชื่อผู้ประสานงาน:</label>
                    <input type="text" id="contactName" placeholder="ชื่อ-นามสกุล ผู้รับผิดชอบ" required>
                </div>

                <div class="form-group">
                    <label for="phone">เบอร์โทรศัพท์ติดต่อ:</label>
                    <input type="tel" id="phone" placeholder="เช่น 0812345678 หรือ เบอร์ภายใน" required>
                </div>
            </div>

            <!-- ส่วนข้อมูลขยะอันตราย -->
            <div class="form-section" style="border-bottom: none; margin-bottom: 0; padding-bottom: 0;">
                
                <div class="form-group">
                    <label for="wasteType">ประเภทขยะอันตราย:</label>
                    <input type="text" id="wasteType" placeholder="คลิกเพื่อเลือกประเภทขยะอันตราย" readonly required style="cursor: pointer;">
                </div>

                <!-- ช่อง "อื่นๆ" ที่เพิ่มระบบ Autocomplete -->
                <div class="form-group hidden autocomplete-wrapper" id="otherWasteGroup">
                    <label for="otherWaste">ระบุประเภทขยะอันตรายอื่นๆ:</label>
                    <input type="text" id="otherWaste" placeholder="พิมพ์เพื่อค้นหาประเภทขยะอันตราย..." autocomplete="off">
                    <ul id="otherWasteDropdown" class="autocomplete-items hidden"></ul>
                </div>

                <!-- พื้นที่สำหรับสร้างช่องกรอกจำนวนอัตโนมัติตามประเภทขยะที่เลือก -->
                <div id="dynamicAmountContainer"></div>
                
                <p style="font-size: 13px; color: #666; text-align: center; margin-top: 10px;">
                    *สามารถเลือกขยะอันตรายได้หลายประเภท และระบุจำนวนแยกกันในครั้งเดียวได้เลย
                </p>

                <!-- ช่องกรอกน้ำหนักรวม -->
                <div class="form-group" style="margin-top: 15px;">
                    <label for="totalWeight">น้ำหนักขยะรวมทั้งหมด (กิโลกรัม):</label>
                    <input type="number" id="totalWeight" value="0.00" min="0" step="0.01" readonly aria-readonly="true" style="background:#f0f3f1;cursor:default">
                </div>

                <!-- ช่องอัปโหลดรูปภาพ -->
                <div class="form-group" style="margin-top: 20px;">
                    <label for="hazardousImage">แนบรูปภาพขยะอันตราย (ถ้ามี):</label>
                    <div class="hazard-file-picker">
                        <input type="file" id="hazardousImage" accept="image/*" class="hazard-file-input" aria-label="เลือกภาพขยะอันตราย">
                        <label for="hazardousImage" class="hazard-file-button">เลือกภาพ</label>
                        <span id="hazardousFileName" class="hazard-file-name" aria-live="polite">ยังไม่ได้เลือกภาพ</span>
                    </div>
                </div>
            </div>

            <button type="submit" id="submitBtn">ส่งข้อมูลขยะอันตราย</button>
        </form>
    </div>

    <!-- Popup เลือกประเภทขยะอันตราย -->

                <label class="waste-card">
