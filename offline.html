<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <title>ต้องเชื่อมต่ออินเทอร์เน็ต</title>
    <style>
      body {
        margin: 0;
        padding: 40px 24px;
        background: #f4f7f6;
        color: #333;
        font:
          16px Tahoma,
          sans-serif;
        line-height: 1.7;
      }
      main {
        max-width: 460px;
        margin: 8vh auto;
      }
      h1 {
        font-size: 24px;
        color: #1e5631;
      }
      p {
        margin: 16px 0;
      }
      .note {
        font-size: 13px;
        color: #68766b;
      }
      a {
        display: inline-block;
        padding: 12px 20px;

  <script src="common/thai-date.js" defer></script><link rel="stylesheet" href="common/theme-unified.css"></head>
  <body>
    <main>
      <h1>ต้องเชื่อมต่ออินเทอร์เน็ต</h1>
      <p>เปิดหน้านี้ไม่ได้ในขณะนี้ ลองอีกครั้งเมื่อเชื่อมต่อแล้ว</p>
      <p class="note">
        แอพไม่ได้บันทึกหรือส่งแบบฟอร์มแบบออฟไลน์
        และไม่ได้เก็บรูปหรือรายงานไว้ให้ส่งภายหลัง
      </p>
      <a href="@@RETRY_URL@@">ลองโหลดหน้านี้อีกครั้ง</a>
      <p class="note">การเปิดหน้าใหม่อาจทำให้ร่างที่ยังไม่ส่งหาย</p>
    </main>
  </body>
