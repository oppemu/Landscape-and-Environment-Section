<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ขยะทั่วไป · เทศบาล</title><link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="../../common/app-form.css"><link rel="stylesheet" href="../../common/file-picker.css"><link rel="stylesheet" href="../../common/popup-select.css"><link rel="stylesheet" href="../../common/popup-theme.css"><style>body{font:18px Anuphan,sans-serif;background:#f2f5f0;color:#222;margin:0;padding:20px}main{max-width:760px;margin:auto;background:white;border-radius:18px;padding:28px}h1{font-size:26px;font-weight:500}label{display:block;margin:16px 0 6px}input,select,textarea,button{box-sizing:border-box;font:inherit;padding:12px;width:100%;border:1px solid #ccd5c9;border-radius:10px;background:white;color:#222}button{cursor:pointer;margin-top:12px}button:active{background:#d9edc7;transform:scale(.98)}button:disabled{opacity:.6}small{color:#555}#message{white-space:pre-line;margin-top:16px}#records button{text-align:left} [hidden]{display:none!important}.municipal-point{margin:18px 0;padding:14px;border:1px solid #d8e1d3;border-radius:12px;min-width:0}.municipal-point legend{padding:0 6px}.point-options{display:grid;grid-template-columns:1fr 1fr;gap:12px}.point-options label{position:relative;margin:0;cursor:pointer}.point-options input{position:absolute;opacity:0;width:1px;height:1px;padding:0}.point-options span{display:block;text-align:center;padding:12px;border:1px solid #a4c579;border-radius:10px;background:#fff;transition:background .18s ease}.point-options input:checked+span{background:#dcebcf;border-color:#86ad59}.point-options input:focus-visible+span{outline:3px solid #527b3d;outline-offset:2px}.point-options input:disabled+span{opacity:.6;cursor:not-allowed}.point-options label:hover span{box-shadow:inset 0 0 0 1px #b8cfa6}@media(prefers-reduced-motion:reduce){.point-options span{transition:none}}</style><link rel="stylesheet" href="../../common/forms-theme.css?v=1"></head><body class="waste-module"><main><img src="../fresh/โลโก้กองกายภาพ.png" alt="กองกายภาพและสิ่งแวดล้อม" style="display:block;max-width:250px;width:100%;margin:0 auto 18px"><h1>ขยะทั่วไป · เทศบาล</h1><form id="form"><label>วันที่เข้าเก็บ</label><input id="date" type="date" required><small id="dateThai"></small><label for="entryStatus">สถานะการเข้า</label><select id="entryStatus" required><option value="">เลือกสถานะ</option><option>เข้า</option><option>ไม่เข้า</option></select><label>เวลาเข้า</label><input id="time" type="time"><small id="timeThai"></small><section class="municipal-points" aria-label="จุดพักขยะ"><fieldset class="municipal-point"><legend>จุดพักขยะ 1</legend><div class="point-options"><label><input type="radio" name="point1" value="เก็บ"><span>เก็บ</span></label><label><input type="radio" name="point1" value="ไม่เก็บ"><span>ไม่เก็บ</span></label></div></fieldset><fieldset class="municipal-point"><legend>จุดพักขยะ 2</legend><div class="point-options"><label><input type="radio" name="point2" value="เก็บ"><span>เก็บ</span></label><label><input type="radio" name="point2" value="ไม่เก็บ"><span>ไม่เก็บ</span></label></div></fieldset><fieldset class="municipal-point"><legend>จุดพักขยะ 3</legend><div class="point-options"><label><input type="radio" name="point3" value="เก็บ"><span>เก็บ</span></label><label><input type="radio" name="point3" value="ไม่เก็บ"><span>ไม่เก็บ</span></label></div></fieldset><fieldset class="municipal-point"><legend>จุดพักขยะ 4</legend><div class="point-options"><label><input type="radio" name="point4" value="เก็บ"><span>เก็บ</span></label><label><input type="radio" name="point4" value="ไม่เก็บ"><span>ไม่เก็บ</span></label></div></fieldset><fieldset class="municipal-point"><legend>จุดพักขยะ 5</legend><div class="point-options"><label><input type="radio" name="point5" value="เก็บ"><span>เก็บ</span></label><label><input type="radio" name="point5" value="ไม่เก็บ"><span>ไม่เก็บ</span></label></div></fieldset></section><label>เวลาออก</label><input id="exitTime" type="time"><small id="exitTimeThai"></small><label>น้ำหนักก่อนเก็บ (กิโลกรัม)</label><input id="beforeWeight" type="number" min="0" step="any"><label>น้ำหนักหลังเก็บ (กิโลกรัม)</label><input id="afterWeight" type="number" min="0" step="any"><label>ส่วนต่าง (กิโลกรัม)</label><input id="totalWeight" type="number" readonly><label>รูปภาพน้ำหนักก่อนเก็บ</label><input id="beforePhotos" type="file" accept="image/jpeg,image/png"><small id="oldBefore"></small><label>รูปภาพน้ำหนักหลังเก็บ</label><input id="afterPhotos" type="file" accept="image/jpeg,image/png"><small id="oldAfter"></small><label>ผู้บันทึกข้อมูล</label><input id="recorder" required readonly><button id="submit" type="submit">บันทึก</button><button id="new" type="button" hidden>ยกเลิกการแก้ไข</button></form><div id="message" role="status"></div><h2 style="font-size:21px;font-weight:500">รายการของวันที่เลือก</h2><div id="records"></div></main><script src="../../config/app-config.js"></script><script src="../../common/unified-client.js"></script><script src="../../common/popup-select.js"></script><script src="script.js"></script><script src="../../common/time24.js?v=2.4.32"></script></body></html>
