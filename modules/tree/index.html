        <p>
          พื้นหลังเวกเตอร์ OpenStreetMap ณ 7 พฤศจิกายน 2569 แสดงอาคาร ถนน และแหล่งน้ำโดยไม่มีป้ายชื่อ ไม่ส่งพิกัดต้นไม้ให้บริการแผนที่
