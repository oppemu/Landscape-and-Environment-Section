<small>งานภูมิทัศน์และสิ่งแวดล้อม</small><h1>บันทึกการเก็บเศษอาหาร</h1><p>กรอกเฉพาะข้อมูลที่มี ช่องที่ไม่ได้กรอกจะไม่นับเป็น 0</p>

<label>ชื่อผู้บันทึก<input id="foodRecorder" autocomplete="name" maxlength="200"></label>
<div class="food-sites"><section class="food-point"><h2><button type="button" class="food-point-toggle" id="foodToggle0" aria-expanded="true" aria-controls="foodPanel0">1. หอพักนักศึกษา 10<span aria-hidden="true" class="food-chevron">⌄</span></button></h2><div class="food-point-panel" id="foodPanel0"><label>เวลาที่เก็บ<input id="foodTime0" type="time"></label><label>จำนวนถัง<input id="foodBins0" type="number" min="0" step="1" inputmode="numeric" placeholder="จำนวนถัง"></label><label>น้ำหนัก (กิโลกรัม)<input id="foodWeight0" type="number" min="0" step="0.01" inputmode="decimal" placeholder="ระบุน้ำหนัก (ถ้ามี)" data-location="หอพักศึกษา 10"></label><label>ปัญหาที่พบ<textarea id="foodProblem0" rows="3" maxlength="2000"></textarea></label></div></section><section class="food-point"><h2><button type="button" class="food-point-toggle" id="foodToggle1" aria-expanded="true" aria-controls="foodPanel1">2. คณะสิ่งแวดล้อมและทรัพยากรศาสตร์<span aria-hidden="true" class="food-chevron">⌄</span></button></h2><div class="food-point-panel" id="foodPanel1"><label>เวลาที่เก็บ<input id="foodTime1" type="time"></label><label>จำนวนถัง<input id="foodBins1" type="number" min="0" step="1" inputmode="numeric" placeholder="จำนวนถัง"></label><label>น้ำหนัก (กิโลกรัม)<input id="foodWeight1" type="number" min="0" step="0.01" inputmode="decimal" placeholder="ระบุน้ำหนัก (ถ้ามี)" data-location="คณะสิ่งแวดล้อม"></label><label>ปัญหาที่พบ<textarea id="foodProblem1" rows="3" maxlength="2000"></textarea></label></div></section><section class="food-point"><h2><button type="button" class="food-point-toggle" id="foodToggle2" aria-expanded="true" aria-controls="foodPanel2">3. ศูนย์การเรียนรู้มหิดล<span aria-hidden="true" class="food-chevron">⌄</span></button></h2><div class="food-point-panel" id="foodPanel2"><label>เวลาที่เก็บ<input id="foodTime2" type="time"></label><label>จำนวนถัง<input id="foodBins2" type="number" min="0" step="1" inputmode="numeric" placeholder="จำนวนถัง"></label><label>น้ำหนัก (กิโลกรัม)<input id="foodWeight2" type="number" min="0" step="0.01" inputmode="decimal" placeholder="ระบุน้ำหนัก (ถ้ามี)" data-location="ศูนย์การเรียนรู้ MLC"></label><label>ปัญหาที่พบ<textarea id="foodProblem2" rows="3" maxlength="2000"></textarea></label></div></section><section class="food-point"><h2><button type="button" class="food-point-toggle" id="foodToggle3" aria-expanded="true" aria-controls="foodPanel3">4. คณะสังคมศาสตร์และมนุษยศาสตร์<span aria-hidden="true" class="food-chevron">⌄</span></button></h2><div class="food-point-panel" id="foodPanel3"><label>เวลาที่เก็บ<input id="foodTime3" type="time"></label><label>จำนวนถัง<input id="foodBins3" type="number" min="0" step="1" inputmode="numeric" placeholder="จำนวนถัง"></label><label>น้ำหนัก (กิโลกรัม)<input id="foodWeight3" type="number" min="0" step="0.01" inputmode="decimal" placeholder="ระบุน้ำหนัก (ถ้ามี)" data-location="คณะสังคม"></label><label>ปัญหาที่พบ<textarea id="foodProblem3" rows="3" maxlength="2000"></textarea></label></div></section><section class="food-point"><h2><button type="button" class="food-point-toggle" id="foodToggle4" aria-expanded="true" aria-controls="foodPanel4">5. สำนักงานอธิการบดี<span aria-hidden="true" class="food-chevron">⌄</span></button></h2><div class="food-point-panel" id="foodPanel4"><label>เวลาที่เก็บ<input id="foodTime4" type="time"></label><label>จำนวนถัง<input id="foodBins4" type="number" min="0" step="1" inputmode="numeric" placeholder="จำนวนถัง"></label><label>น้ำหนัก (กิโลกรัม)<input id="foodWeight4" type="number" min="0" step="0.01" inputmode="decimal" placeholder="ระบุน้ำหนัก (ถ้ามี)" data-location="สำนักงานอธิการบดี OP"></label><label>ปัญหาที่พบ<textarea id="foodProblem4" rows="3" maxlength="2000"></textarea></label></div></section><section class="food-point"><h2><button type="button" class="food-point-toggle" id="foodToggle5" aria-expanded="true" aria-controls="foodPanel5">6. กองกายภาพและสิ่งแวดล้อม<span aria-hidden="true" class="food-chevron">⌄</span></button></h2><div class="food-point-panel" id="foodPanel5"><label>เวลาที่เก็บ<input id="foodTime5" type="time"></label><label>จำนวนถัง<input id="foodBins5" type="number" min="0" step="1" inputmode="numeric" placeholder="จำนวนถัง"></label><label>น้ำหนัก (กิโลกรัม)<input id="foodWeight5" type="number" min="0" step="0.01" inputmode="decimal" placeholder="ระบุน้ำหนัก (ถ้ามี)" data-location="กองกายภาพ"></label><label>ปัญหาที่พบ<textarea id="foodProblem5" rows="3" maxlength="2000"></textarea></label></div></section><section class="food-point"><h2><button type="button" class="food-point-toggle" id="foodToggle6" aria-expanded="true" aria-controls="foodPanel6">7. คณะพยาบาลศาสตร์<span aria-hidden="true" class="food-chevron">⌄</span></button></h2><div class="food-point-panel" id="foodPanel6"><label>เวลาที่เก็บ<input id="foodTime6" type="time"></label><label>จำนวนถัง<input id="foodBins6" type="number" min="0" step="1" inputmode="numeric" placeholder="จำนวนถัง"></label><label>น้ำหนัก (กิโลกรัม)<input id="foodWeight6" type="number" min="0" step="0.01" inputmode="decimal" placeholder="ระบุน้ำหนัก (ถ้ามี)" data-location="คณะพยาบาล"></label><label>ปัญหาที่พบ<textarea id="foodProblem6" rows="3" maxlength="2000"></textarea></label></div></section><section class="food-point"><h2><button type="button" class="food-point-toggle" id="foodToggle7" aria-expanded="true" aria-controls="foodPanel7">8. คอนโด<span aria-hidden="true" class="food-chevron">⌄</span></button></h2><div class="food-point-panel" id="foodPanel7"><label>เวลาที่เก็บ<input id="foodTime7" type="time"></label><label>จำนวนถัง<input id="foodBins7" type="number" min="0" step="1" inputmode="numeric" placeholder="จำนวนถัง"></label><label>น้ำหนัก (กิโลกรัม)<input id="foodWeight7" type="number" min="0" step="0.01" inputmode="decimal" placeholder="ระบุน้ำหนัก (ถ้ามี)" data-location="งานจราจร"></label><label>ปัญหาที่พบ<textarea id="foodProblem7" rows="3" maxlength="2000"></textarea></label></div></section><section class="food-point"><h2><button type="button" class="food-point-toggle" id="foodToggle8" aria-expanded="true" aria-controls="foodPanel8">9. คณะวิทยาศาสตร์<span aria-hidden="true" class="food-chevron">⌄</span></button></h2><div class="food-point-panel" id="foodPanel8"><label>เวลาที่เก็บ<input id="foodTime8" type="time"></label><label>จำนวนถัง<input id="foodBins8" type="number" min="0" step="1" inputmode="numeric" placeholder="จำนวนถัง"></label><label>น้ำหนัก (กิโลกรัม)<input id="foodWeight8" type="number" min="0" step="0.01" inputmode="decimal" placeholder="ระบุน้ำหนัก (ถ้ามี)" data-location="วิทยาศาสตร์"></label><label>ปัญหาที่พบ<textarea id="foodProblem8" rows="3" maxlength="2000"></textarea></label></div></section><section class="food-point"><h2><button type="button" class="food-point-toggle" style="background:#344d68!important;color:#fff!important" id="foodToggle9" aria-expanded="true" aria-controls="foodPanel9">10. หอประชุมมหิดลสิทธาคาร<span aria-hidden="true" class="food-chevron">⌄</span></button></h2><div class="food-point-panel" id="foodPanel9"><label>เวลาที่เก็บ<input id="foodTime9" type="time"></label><label>จำนวนถัง<input id="foodBins9" type="number" min="0" step="1" inputmode="numeric" placeholder="จำนวนถัง"></label><label>น้ำหนัก (กิโลกรัม)<input id="foodWeight9" type="number" min="0" step="0.01" inputmode="decimal" placeholder="ระบุน้ำหนัก (ถ้ามี)" data-location="หอประชุมมหิดลสิทธาคาร"></label><label>ปัญหาที่พบ<textarea id="foodProblem9" rows="3" maxlength="2000"></textarea></label></div></section></div><section class="food-total"><label>จำนวนถังที่กรอก (รวม)<input id="foodBinsTotal" readonly placeholder="ยังไม่มีข้อมูล"></label><label>น้ำหนักที่กรอก (รวม กิโลกรัม)<input id="foodWeightTotal" readonly placeholder="ยังไม่มีข้อมูล"></label></section><label>รูปประกอบ (ไม่บังคับ)<input id="foodPhoto" type="file" multiple accept="image/jpeg,image/png,image/webp"></label></div><p id="foodBatchNotice" role="status" hidden></p><button type="button" id="foodPrepareButton">บันทึกข้อมูล</button></form><
